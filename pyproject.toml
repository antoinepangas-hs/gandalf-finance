[project]
name = "gandalf-finance"
dynamic = ["version", "optional-dependencies"]
description = "Agent-as-judge grading framework for evaluating AI agent outputs against rubric criteria"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Handshake" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.2,<4",
    "jinja2>=3.1,<4",
    "litellm>=1.82.0,<2",
    "openpyxl>=3.1.5",
    "openhands-sdk>=1.11.2,<1.16.1",
    "openhands-tools>=1.11.2,<1.16.1",
    "pydantic>=2.12.5,<3",
    "xlwings>=0.33,<1",
]

[project.urls]
homepage = "https://github.com/antoinepangas-hs/gandalf-finance"
repository = "https://github.com/antoinepangas-hs/gandalf-finance"
issues = "https://github.com/antoinepangas-hs/gandalf-finance/issues"

[project.scripts]
gandalf-the-grader = "gandalf.orchestrator:main"
gandalf-the-grader-judge = "gandalf.judge:main"
gandalf-excel-mcp = "gandalf.excel_mcp:main"
gandalf-excel-worker = "gandalf.excel_worker:main"

[build-system]
requires = ["hatchling", "hatch-pinned-extra>=0.2.0,<0.3.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gandalf/__about__.py"

[tool.hatch.build.targets.sdist]
# The verifier image installs this sdist. Tests, the lockfile and any ops
# tooling are development-only and must not ride into a shipped grader.
include = ["src/gandalf", "pyproject.toml", "README.md", "LICENSE.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/gandalf"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.metadata.hooks.pinned_extra]
name = "pinned"

[dependency-groups]
# python-docx is only used by helper scripts under scripts/ (and their tests),
# not by the shipped gandalf package.
dev = ["pytest>=8.0", "ruff>=0.15.0", "mypy>=1.19.0", "python-docx>=1.2.0"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.types]
extra-dependencies = [
    "mypy>=1.19.0",
    "pytest>=8.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy {args:src tests}"

[tool.hatch.envs.coverage]
detached = true
installer = "uv"
dependencies = [
    "coverage[toml]",
]

[tool.hatch.envs.coverage.scripts]
html = "coverage html"
xml = "coverage xml"

[tool.coverage.run]
omit = [
    "*/tests/*",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["openhands.sdk", "openhands.tools.*", "litellm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "excel: opt-in tests that automate Microsoft Excel",
    "llm: end-to-end tests that call a real LLM (require LLM_API_KEY)",
]
addopts = "-m 'not llm'"

